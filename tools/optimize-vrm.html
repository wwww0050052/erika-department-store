<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>VRM 瘦身（開發用）</title></head>
<body style="font:12px monospace;padding:10px;white-space:pre-wrap" id="log">
<script type="module">
// 用法：/tools/optimize-vrm.html?m=victoria&max=1024&q=0.9&save=1
// 1. 法線貼圖（normalTexture / _BumpMap）換成 8x8 平面貼圖  2. 超過 max 的貼圖縮小  3. 全部轉成 WebP（EXT_texture_webp）
// 輸出到 assets/models/<名稱>.vrm
const q = new URLSearchParams(location.search);
const names = (q.get('m') || 'victoria').split(',');
const MAX = +(q.get('max') || 1024), QUAL = +(q.get('q') || 0.9), SAVE = q.get('save') === '1';
const log = s => { document.body.textContent += s + '\n'; };
const pad4 = n => (n + 3) & ~3;

async function optimize(name) {
  const buf = new Uint8Array(await (await fetch(`../_raw/${name}.vrm`)).arrayBuffer());
  const dv = new DataView(buf.buffer);
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(buf.subarray(20, 20 + jsonLen)));
  const binOff = 20 + jsonLen + 8;
  const binLen = dv.getUint32(20 + jsonLen, true);
  const bin = buf.subarray(binOff, binOff + binLen);
  const view = i => { const bv = json.bufferViews[i]; return bin.subarray(bv.byteOffset || 0, (bv.byteOffset || 0) + bv.byteLength); };

  // 找出當法線貼圖用的圖片
  const normalImgs = new Set();
  for (const m of json.materials) if (m.normalTexture) { normalImgs.add(json.textures[m.normalTexture.index].source); delete m.normalTexture; }
  for (const mp of json.extensions?.VRM?.materialProperties || []) {
    if (mp.textureProperties?._BumpMap != null) { normalImgs.add(json.textures[mp.textureProperties._BumpMap].source); delete mp.textureProperties._BumpMap; }
    if (mp.floatProperties) mp.floatProperties._BumpScale = 0;
  }
  // 沒被任何貼圖引用的圖片也當成可丟棄
  const usedTex = new Set();
  const walk = o => { if (o && typeof o === 'object') { if (typeof o.index === 'number' && ('texCoord' in o || Object.keys(o).length <= 3)) usedTex.add(o.index); for (const v of Object.values(o)) walk(v); } };
  walk(json.materials);
  for (const mp of json.extensions?.VRM?.materialProperties || []) for (const v of Object.values(mp.textureProperties || {})) usedTex.add(v);
  const usedImg = new Set([...usedTex].map(t => json.textures[t]?.source));

  // 8x8 中性平面貼圖
  const tiny = document.createElement('canvas'); tiny.width = tiny.height = 8;
  const tc = tiny.getContext('2d'); tc.fillStyle = 'rgb(128,128,255)'; tc.fillRect(0, 0, 8, 8);
  const tinyBytes = new Uint8Array(await (await new Promise(r => tiny.toBlob(r, 'image/webp', 0.9))).arrayBuffer());

  const newImg = [];
  for (let i = 0; i < json.images.length; i++) {
    const im = json.images[i];
    if (normalImgs.has(i) || !usedImg.has(i)) { newImg[i] = tinyBytes; log(`  圖 ${i} → 平面 8x8`); continue; }
    const bmp = await createImageBitmap(new Blob([view(im.bufferView)], { type: im.mimeType }));
    const s = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(bmp, 0, 0, c.width, c.height);
    newImg[i] = new Uint8Array(await (await new Promise(r => c.toBlob(r, 'image/webp', QUAL))).arrayBuffer());
    log(`  圖 ${i} ${bmp.width}x${bmp.height} → ${c.width}x${c.height}  ${(view(im.bufferView).length / 1024) | 0}KB → ${(newImg[i].length / 1024) | 0}KB`);
  }

  // 重新打包 BIN
  const parts = [];
  let off = 0;
  const imgView = new Map(json.images.map((im, i) => [im.bufferView, i]));
  json.bufferViews.forEach((bv, i) => {
    const data = imgView.has(i) ? newImg[imgView.get(i)] : view(i);
    off = pad4(off);
    parts.push([off, data]);
    bv.byteOffset = off; bv.byteLength = data.length;
    off += data.length;
  });
  const newBinLen = pad4(off);
  json.buffers[0].byteLength = newBinLen;
  for (const im of json.images) im.mimeType = 'image/webp';
  for (const t of json.textures) { t.extensions = { ...(t.extensions || {}), EXT_texture_webp: { source: t.source } }; delete t.source; }
  json.extensionsUsed = [...new Set([...(json.extensionsUsed || []), 'EXT_texture_webp'])];
  json.extensionsRequired = [...new Set([...(json.extensionsRequired || []), 'EXT_texture_webp'])];

  let jsonBytes = new TextEncoder().encode(JSON.stringify(json));
  const jsonPadded = pad4(jsonBytes.length);
  const total = 12 + 8 + jsonPadded + 8 + newBinLen;
  const outBuf = new Uint8Array(total);
  const o = new DataView(outBuf.buffer);
  o.setUint32(0, 0x46546C67, true); o.setUint32(4, 2, true); o.setUint32(8, total, true);
  o.setUint32(12, jsonPadded, true); o.setUint32(16, 0x4E4F534A, true);
  outBuf.set(jsonBytes, 20); outBuf.fill(0x20, 20 + jsonBytes.length, 20 + jsonPadded);
  const b0 = 20 + jsonPadded;
  o.setUint32(b0, newBinLen, true); o.setUint32(b0 + 4, 0x004E4942, true);
  for (const [po, data] of parts) outBuf.set(data, b0 + 8 + po);
  log(`${name}: ${(buf.length / 1048576).toFixed(2)}MB → ${(total / 1048576).toFixed(2)}MB`);
  if (SAVE) { const r = await fetch(`/__save/assets/models/${name}.vrm`, { method: 'PUT', body: outBuf }); log('  存檔 ' + r.status); }
}
for (const n of names) await optimize(n);
document.body.dataset.done = '1';
</script></body></html>
