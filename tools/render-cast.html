<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>角色立繪渲染（開發用）</title>
<style>body{margin:0;padding:10px;background:#fbeef2;font:12px sans-serif}.g{display:flex;flex-wrap:wrap;gap:8px}img{background:linear-gradient(#fff,#fde7ee);border-radius:8px;max-height:300px}#log{white-space:pre-wrap;font:11px monospace}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/","@pixiv/three-vrm":"../vendor/three-vrm/three-vrm.module.min.js"}}</script>
</head><body><div class="g" id="g"></div><div id="log"></div>
<script type="module">
// 用法：/tools/render-cast.html?save=1&m=vivi,vita   （save=1 才會寫檔到 assets/cast/）
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const q = new URLSearchParams(location.search);
const SAVE = q.get('save') === '1';
const names = (q.get('m') || 'victoria,vivi,vita,shibu,shino,fumiriya').split(',');
const src = q.get('src') || '../_raw/';
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const EXPR = { neutral: {}, joy: { happy: 1 }, angry: { angry: 0.9 }, sad: { sad: 0.9 } };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

async function put(path, canvas, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(canvas, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.9));
  const img = new Image(); img.src = URL.createObjectURL(blob); img.title = path; document.getElementById('g').appendChild(img);
  if (SAVE) { const r = await fetch('/__save/' + path, { method: 'PUT', body: blob }); log(`${path} ${(blob.size / 1024) | 0}KB ${r.status}`); }
}

export function pose(vrm, t = 0) {
  const b = n => vrm.humanoid.getNormalizedBoneNode(n);
  const s = Math.sin(t * 1.6);
  b('leftUpperArm').rotation.set(0, 0, 1.18); b('rightUpperArm').rotation.set(0, 0, -1.22);
  b('leftLowerArm').rotation.set(0, -0.25, 0.1); b('rightLowerArm').rotation.set(0, 0.3, -0.12);
  b('leftHand').rotation.set(0, 0, 0.15); b('rightHand').rotation.set(0, 0, -0.15);
  b('spine').rotation.set(0.02 * s, 0, 0); b('chest') && b('chest').rotation.set(0, 0, 0);
  b('neck').rotation.set(0, 0, 0.04); b('head').rotation.set(0.04, -0.06, 0.06);
  b('hips').rotation.set(0, 0.2, 0);
  b('leftUpperLeg').rotation.set(0, 0, 0.03); b('rightUpperLeg').rotation.set(0, 0.12, -0.05);
  b('rightLowerLeg').rotation.set(0.12, 0, 0);
}

for (const n of names) {
  const gltf = await loader.loadAsync(src + n + '.vrm');
  const vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  const scene = new THREE.Scene();
  const key = new THREE.DirectionalLight(0xfff4ee, 2.4); key.position.set(-0.8, 1.8, 2.2); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd6e6, 1.2); rim.position.set(1.2, 1.4, -1.5); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  scene.add(vrm.scene);
  pose(vrm);
  vrm.update(1 / 60);
  vrm.springBoneManager?.reset();
  for (let i = 0; i < 180; i++) vrm.update(1 / 60);   // 讓頭髮、裙擺的物理自然垂下
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const head = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3());
  const footY = box.min.y, topY = head.y + 0.16;

  // 全身立繪
  renderer.setSize(480, 840);
  const full = new THREE.PerspectiveCamera(20, 480 / 840, 0.1, 30);
  const hh = topY - footY + 0.08;
  const dist = (hh / 2) / Math.tan(THREE.MathUtils.degToRad(10)) * 1.02;
  full.position.set(0, footY + hh * 0.5, dist); full.lookAt(0, footY + hh * 0.5 - 0.01, 0);
  vrm.expressionManager.resetValues(); vrm.expressionManager.setValue('happy', 0.35); vrm.expressionManager.update();
  renderer.render(scene, full);
  await put(`assets/cast/${n}-full.webp`, renderer.domElement, 480, 840);

  // 胸像四種表情
  renderer.setSize(512, 512);
  const bust = new THREE.PerspectiveCamera(22, 1, 0.1, 30);
  bust.position.set(0.04, head.y + 0.03, 1.3); bust.lookAt(0, head.y + 0.01, 0);
  for (const [k, ex] of Object.entries(EXPR)) {
    vrm.expressionManager.resetValues();
    for (const [e, v] of Object.entries(ex)) vrm.expressionManager.setValue(e, v);
    vrm.expressionManager.update();
    renderer.render(scene, bust);
    await put(`assets/cast/${n}-${k}.webp`, renderer.domElement, 384, 384);
  }
  VRMUtils.deepDispose(vrm.scene);
  log(n + ' done');
}
document.body.dataset.done = '1';
</script></body></html>
